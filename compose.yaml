services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: beaverbids
      POSTGRES_PASSWORD: beaverbids
      POSTGRES_DB: beaverbids
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql
  # Local mail catcher: the worker sends to SMTP on 1025 and every message
  # shows at http://localhost:8025. Nothing is persisted or delivered.
  mail:
    image: axllent/mailpit:v1.33.0
    ports:
      - "1025:1025"
      - "8025:8025"
volumes:
  dbdata:
